[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jeff"
version = "0.1.0"
description = "System 1 decision model — open reproduction of JEV"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.3",
    "transformers>=4.45",
    "datasets>=2.21",
    "accelerate>=0.34",
    "peft>=0.13",
    "trl>=0.11",          # DPO / RLCD trainers
    "einops>=0.8",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "wandb>=0.18",
    "sentencepiece>=0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.hatch.build.targets.wheel]
packages = ["jeff"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
