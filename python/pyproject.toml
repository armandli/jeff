[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jeff"
version = "0.1.0"
description = "System 1 decision model — open reproduction of JEV"
# 3.10 matches anyjev's minimum; Qwen3 tooling works on 3.10+
requires-python = ">=3.10"
dependencies = [
    # Core ML stack — torch itself is installed separately by setup_env.sh
    # because the wheel URL depends on the local CUDA version.
    "transformers>=4.53",       # Qwen3 support landed in 4.51; 4.53 for stability
    "accelerate>=0.34",
    "datasets>=2.21",
    "sentencepiece>=0.2",
    "tiktoken>=0.7",            # Qwen3 tokenizer fallback
    "einops>=0.8",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "wandb>=0.18",

    # LoRA / QLoRA
    "peft>=0.14",               # 0.14+ has QLoRA fixes for Qwen3 attention layers
    "bitsandbytes>=0.44",       # 4-bit / 8-bit quantisation for QLoRA

    # Training helpers
    "trl>=0.12",                # SFTTrainer, DPOTrainer, updated API for Qwen3

    # AnyJev: permutation-debiased decision readout
    "anyjev[hf]>=0.3",

    # exp_004: GLiNER2 schema-classification encoder (fast Doom action policy)
    "gliner2[train]>=2.1",
]

[project.optional-dependencies]
# Flash-Attention is strongly recommended for Qwen3-8B throughput but requires
# a CUDA-version-matched wheel; install via setup_env.sh --flash-attn.
flash = [
    "flash-attn>=2.6",
]
# exp_002: text-only Doom agent (ViZDoom bundles the engine, Freedoom and scenarios)
doom = [
    "vizdoom>=1.3",
]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.hatch.build.targets.wheel]
packages = ["jeff"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
